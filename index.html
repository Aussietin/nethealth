<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Content Security Policy: default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />
  <title>NetHealth Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <button id="navToggle" aria-label="Toggle navigation" class="icon-button">☰</button>
    <h1 class="title">NetHealth</h1>
    <button id="themeToggle" aria-label="Toggle dark/light mode" class="icon-button">🌓</button>
  </header>

  <nav class="side-nav" aria-label="Main navigation">
    <ul>
      <li><a href="#" class="nav-link active" data-section="dashboard">Dashboard</a></li>
      <li><a href="#" class="nav-link" data-section="settings">Settings</a></li>
      <li><a href="#" class="nav-link" data-section="about">About</a></li>
    </ul>
  </nav>

  <main class="main-content" id="mainContent">
    <!-- Dashboard Section -->
    <section id="dashboard" class="section active">
      <div class="cards-container">
        <div class="card" id="card1">
          <h2 class="card-title">CPU Usage</h2>
          <canvas class="chart" id="cpuChart" width="200" height="100"></canvas>
        </div>
        <div class="card" id="card2">
          <h2 class="card-title">Memory Usage</h2>
          <canvas class="chart" id="memChart" width="200" height="100"></canvas>
        </div>
        <div class="card" id="card3">
          <h2 class="card-title">Network Latency</h2>
          <canvas class="chart" id="netChart" width="200" height="100"></canvas>
        </div>
      </div>
      <button id="exportBtn" class="btn primary">Export Data</button>
    </section>

    <!-- Settings Section -->
    <section id="settings" class="section hidden">
      <h2>Settings</h2>
      <form id="settingsForm" class="form">
        <label for="refreshInterval">Refresh Interval (seconds)</label>
        <input type="number" id="refreshInterval" name="refreshInterval" min="1" value="5" />
        <label for="themeSelect">Default Theme</label>
        <select id="themeSelect" name="themeSelect">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <button type="submit" class="btn primary">Save</button>
      </form>
    </section>

    <!-- About Section -->
    <section id="about" class="section hidden">
      <h2>About NetHealth</h2>
      <p>This UI is a secure, premium‑looking prototype for monitoring network health metrics.</p>
      <p>Version: 0.1.0</p>
    </section>
  </main>

  <!-- Toast container for notifications -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js" defer></script>
</body>
</html>

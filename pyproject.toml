[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nethealth"
version = "0.1.0"
description = "Network health CLI tool"
requires-python = ">=3.9"
dependencies = [
    "click",
    "rich",
    "httpx",
    "dnspython",
    "textual",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nethealth = "nethealth.cli:cli"

[tool.setuptools]
packages = ["nethealth", "nethealth.checks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
